<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MIHIRI · The After-Dark Pâtisserie, Kurunegala</title>
<meta name="description" content="Handcrafted cakes, cupcakes, desserts and cookies from MIHIRI in Kurunegala. Fill your box and send your order on WhatsApp.">
<meta name="theme-color" content="#000000">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20120%20120%22%3E%3Ccircle%20cx%3D%2260%22%20cy%3D%2260%22%20r%3D%2260%22%20fill%3D%22%23000%22%2F%3E%3Ccircle%20cx%3D%2260%22%20cy%3D%2260%22%20r%3D%2254%22%20fill%3D%22none%22%20stroke%3D%22%23c9a46a%22%20stroke-width%3D%224%22%2F%3E%3Cpath%20d%3D%22M%2032%2086%20L%2032%2052%20C%2032%2040%2044%2036%2050%2046%20L%2060%2064%20L%2070%2046%20C%2076%2036%2088%2040%2088%2052%20L%2088%2086%22%20fill%3D%22none%22%20stroke%3D%22%23d4b47a%22%20stroke-width%3D%228%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%2F%3E%3Cpath%20d%3D%22M60%2018%20C%2065%2028%2068%2033%2060%2038%20C%2052%2033%2055%2028%2060%2018Z%22%20fill%3D%22%23d2394d%22%2F%3E%3C%2Fsvg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Italiana&amp;family=Great+Vibes&amp;family=Josefin+Sans:ital,wght@0,300;0,400;0,500;1,300&amp;display=swap">
<style>
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;background:#000000}
body{margin:0;background:#000000}
a{color:inherit;text-decoration:none}
a:hover{color:#e8cf9f}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer}
img{display:block;max-width:100%}
:focus-visible{outline:2px solid #d4b47a;outline-offset:3px}
.m{position:relative;min-height:100vh;background:#000000;color:#f3e9dc;font-family:var(--fb);font-weight:300;overflow-x:clip;-webkit-font-smoothing:antialiased}
.wrap{width:100%;max-width:1320px;margin:0 auto;padding:0 40px}
.ic{fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}

/* typeface options (Tweaks › Typeface) */
.t1{--fd:'Cormorant Garamond',serif;--fwm:600;--fdz:1;--fe:'Cormorant Garamond',serif;--fes:italic;--fez:1;--fq:'Cormorant Garamond',serif;--fqz:1;--fb:'Jost',system-ui,sans-serif;--fs:'Mr Dafoe',cursive;--fss:normal;--fsz:1}
.t2{--fd:'Bodoni Moda',serif;--fwm:600;--fdz:.84;--fe:'Bodoni Moda',serif;--fes:italic;--fez:1;--fq:'Bodoni Moda',serif;--fqz:.9;--fb:'Manrope',system-ui,sans-serif;--fs:'Pinyon Script',cursive;--fss:normal;--fsz:.92}
.t3{--fd:'Italiana',serif;--fwm:400;--fdz:.92;--fe:'Great Vibes',cursive;--fes:normal;--fez:1.12;--fq:'Josefin Sans',sans-serif;--fqz:.8;--fb:'Josefin Sans',system-ui,sans-serif;--fs:'Great Vibes',cursive;--fss:normal;--fsz:1}
.t4{--fd:'Cinzel',serif;--fwm:600;--fdz:.66;--fe:'Allura',cursive;--fes:normal;--fez:1.42;--fq:'Lato',sans-serif;--fqz:.8;--fb:'Lato',system-ui,sans-serif;--fs:'Allura',cursive;--fss:normal;--fsz:1.08}
.t5{--fd:'Fraunces',serif;--fwm:600;--fdz:.84;--fe:'Fraunces',serif;--fes:italic;--fez:1;--fq:'Fraunces',serif;--fqz:.88;--fb:'Outfit',system-ui,sans-serif;--fs:'Fraunces',serif;--fss:italic;--fsz:.8}
.t6{--fd:'Instrument Serif',serif;--fwm:400;--fdz:1.04;--fe:'Instrument Serif',serif;--fes:italic;--fez:1;--fq:'Instrument Serif',serif;--fqz:1;--fb:'Instrument Sans',system-ui,sans-serif;--fs:'Instrument Serif',serif;--fss:italic;--fsz:.9}
.t7{--fd:'Playfair Display',serif;--fwm:600;--fdz:.82;--fe:'Playfair Display',serif;--fes:italic;--fez:1;--fq:'Playfair Display',serif;--fqz:.88;--fb:'Mulish',system-ui,sans-serif;--fs:'Monsieur La Doulaise',cursive;--fss:normal;--fsz:1.12}
.t8{--fd:'DM Serif Display',serif;--fwm:400;--fdz:.82;--fe:'DM Serif Display',serif;--fes:italic;--fez:1;--fq:'DM Serif Display',serif;--fqz:.88;--fb:'DM Sans',system-ui,sans-serif;--fs:'DM Serif Display',serif;--fss:italic;--fsz:.78}

/* seal */
.seal{display:block;flex:none}
.seal-c{fill:none;stroke:#c9a46a;stroke-width:2.5}
.seal-c2{fill:none;stroke:#c9a46a;stroke-width:1;opacity:.45}
.seal-m{fill:none;stroke:#d4b47a;stroke-width:6.5;stroke-linecap:round;stroke-linejoin:round}
.seal-f{fill:#d2394d;transform-box:fill-box;transform-origin:50% 100%;animation:flicker 2.6s ease-in-out infinite}

/* header */
.hd{position:sticky;top:0;z-index:50;background:rgba(0,0,0,.74);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid rgba(201,164,106,.14)}
.hd-in{display:flex;align-items:center;justify-content:space-between;height:76px;gap:24px}
.brand{display:flex;align-items:center;gap:14px;min-height:44px}
.brand:hover{color:inherit}
.brand .seal{width:42px;height:42px}
.wm{font-family:var(--fd);font-weight:var(--fwm);font-size:22px;letter-spacing:.42em;margin-right:-.42em;color:#f3e9dc}
.nav{display:flex;gap:34px}
.nav a{font-size:12px;font-weight:400;letter-spacing:.24em;text-transform:uppercase;color:#b9a99a;padding:14px 0;transition:color .3s}
.nav a:hover{color:#f3e9dc}
.boxbtn{display:flex;align-items:center;gap:10px;height:46px;padding:0 8px 0 18px;border:1px solid rgba(201,164,106,.4);border-radius:999px;font-size:12px;font-weight:400;letter-spacing:.2em;text-transform:uppercase;color:#f3e9dc;transition:background .3s,border-color .3s}
.boxbtn:hover{background:rgba(201,164,106,.1);border-color:#c9a46a;color:#f3e9dc}
.boxbtn .ic{width:18px;height:18px;color:#d4b47a}
.badge{min-width:30px;height:30px;border-radius:15px;background:#c9a46a;color:#000000;font-size:13px;font-weight:500;letter-spacing:0;display:grid;place-items:center;padding:0 8px}
.badge.pop{animation:pop .6s cubic-bezier(.3,1.6,.5,1)}

/* shared type */
.eyebrow{display:flex;align-items:center;gap:14px;margin:0 0 26px;font-size:12px;font-weight:400;letter-spacing:.32em;text-transform:uppercase;color:#c9a46a}
.eyebrow.center{justify-content:center}
.dash{display:block;width:40px;height:1px;background:#c9a46a;flex:none}
.sec-title{margin:0;font-family:var(--fd);font-weight:500;font-size:calc(clamp(44px,5.4vw,80px) * var(--fdz));line-height:.98;color:#f3e9dc;text-align:center}
.sec-title em{font-family:var(--fe);font-style:var(--fes);font-weight:400;font-size:calc(1em * var(--fez));color:#d4b47a}
.sec-title.left{text-align:left}
.btn{display:inline-flex;align-items:center;gap:12px;min-height:54px;padding:0 30px;border-radius:999px;font-size:12px;font-weight:500;letter-spacing:.22em;text-transform:uppercase;transition:transform .35s cubic-bezier(.2,.8,.2,1),background .3s,color .3s,border-color .3s}
.btn .ic{width:18px;height:18px}
.btn-gold{background:#c9a46a;color:#000000}
.btn-gold:hover{background:#e0c48e;color:#000000;transform:translateY(-2px)}
.btn-line{border:1px solid rgba(201,164,106,.5);color:#f3e9dc}
.btn-line:hover{border-color:#d4b47a;background:rgba(201,164,106,.08);color:#f3e9dc}

/* hero */
.hero{position:relative;padding:64px 0 72px;overflow:hidden}
.hero-word{position:absolute;left:50%;top:130px;transform:translate(-50%,-50%);font-family:var(--fd);font-weight:500;font-size:clamp(120px,22vw,340px);line-height:1;letter-spacing:.12em;color:transparent;-webkit-text-stroke:1px rgba(201,164,106,.12);white-space:nowrap;pointer-events:none;user-select:none}
.hx-copy{position:relative;text-align:center}
.hx-copy .eyebrow{justify-content:center;margin-bottom:22px}
.h1{margin:0;font-family:var(--fd);font-weight:500;font-size:calc(clamp(54px,6.6vw,104px) * var(--fdz));line-height:.95;letter-spacing:-.01em;color:#f3e9dc}
.h1 span,.h1 em{display:inline-block}
.h1 em{margin-left:.24em}
.h1 em{font-family:var(--fe);font-style:var(--fes);font-weight:400;font-size:calc(1em * var(--fez));color:#d4b47a}
.hx{list-style:none;margin-top:52px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:22px}
.hx>li{min-width:0;animation:slidein 1.1s cubic-bezier(.2,.8,.2,1) both}
.hx>li:nth-child(1){animation-delay:.42s}.hx>li:nth-child(2){animation-delay:.54s}.hx>li:nth-child(3){animation-delay:.66s}.hx>li:nth-child(4){animation-delay:.78s}
.hx-tile{position:relative;height:390px;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:0 18px 24px;border-radius:24px;border:1px solid rgba(201,164,106,.2);background:#0a0706;text-align:center;transition:border-color .35s,transform .45s cubic-bezier(.2,.8,.2,1)}
.hx-tile:hover{border-color:rgba(201,164,106,.6);transform:translateY(-6px);color:inherit}
.hx-glow{position:absolute;left:20%;top:9%;width:60%;height:50%;border-radius:50%;filter:blur(46px);opacity:.75}
/* sparks rising through the splash, tinted from it */
.dust{position:absolute;inset:0;pointer-events:none;overflow:hidden;container-type:size;color:#e8cf9f;transition:color .9s ease}
.dust i{position:absolute;bottom:8%;width:3px;height:3px;border-radius:50%;background:#fff6e8;box-shadow:0 0 3px 1px currentColor,0 0 10px 2px currentColor;opacity:0;animation:drift 9s linear infinite}
.dust i:nth-child(1){left:16%;animation-duration:9s;animation-delay:0s}
.dust i:nth-child(2){left:27%;animation-duration:11s;animation-delay:-3s;width:2px;height:2px}
.dust i:nth-child(3){left:38%;animation-duration:8s;animation-delay:-6s}
.dust i:nth-child(4){left:49%;animation-duration:12s;animation-delay:-1s;width:2px;height:2px}
.dust i:nth-child(5){left:59%;animation-duration:10s;animation-delay:-7s}
.dust i:nth-child(6){left:68%;animation-duration:9.5s;animation-delay:-4s;width:4px;height:4px}
.dust i:nth-child(7){left:77%;animation-duration:13s;animation-delay:-9s;width:2px;height:2px}
.dust i:nth-child(8){left:86%;animation-duration:10.5s;animation-delay:-2s}
.dust i:nth-child(9){left:32%;animation-duration:14s;animation-delay:-11s;width:2px;height:2px}
.dust i:nth-child(10){left:63%;animation-duration:8.5s;animation-delay:-5s}
.dust i:nth-child(11){left:21%;animation-duration:12.5s;animation-delay:-8s;width:4px;height:4px}
.dust i:nth-child(12){left:81%;animation-duration:11.5s;animation-delay:-10s;width:2px;height:2px}
.hx-no{position:absolute;left:20px;top:25px;font-size:11px;font-weight:400;letter-spacing:.24em;text-transform:uppercase;color:#c9a46a}
.hx-go{position:absolute;right:16px;top:16px;width:36px;height:36px;display:grid;place-items:center;border-radius:999px;border:1px solid rgba(201,164,106,.4);color:#d4b47a;transition:background .3s,color .3s,border-color .3s,transform .45s cubic-bezier(.2,.8,.2,1)}
.hx-go .ic{width:15px;height:15px}
.hx-tile:hover .hx-go{background:#c9a46a;border-color:#c9a46a;color:#000000;transform:rotate(-45deg)}
.hx-pic{position:relative;display:block;animation:floaty 6s ease-in-out infinite}
.hx>li:nth-child(2) .hx-pic{animation-delay:-1.5s}.hx>li:nth-child(3) .hx-pic{animation-delay:-3s}.hx>li:nth-child(4) .hx-pic{animation-delay:-4.5s}
.hx-tile img{position:relative;display:block;width:236px;height:236px;object-fit:contain;margin-bottom:8px;filter:drop-shadow(0 16px 20px rgba(0,0,0,.55));transition:transform .6s cubic-bezier(.2,.8,.2,1)}
.hx-tile:hover img{transform:scale(1.06) rotate(-2deg)}
.hx-name{position:relative;font-family:var(--fd);font-weight:400;font-size:calc(36px * var(--fdz));line-height:1.08;color:#f3e9dc;text-wrap:balance}
.hx-meta{position:relative;margin-top:8px;font-size:11px;font-weight:400;letter-spacing:.24em;text-transform:uppercase;color:#9a8b7d}
.hx-cta{position:relative;display:flex;flex-wrap:wrap;justify-content:center;gap:14px;margin-top:46px}
.rise{animation:enter 1.1s cubic-bezier(.2,.8,.2,1) both}
.r1{animation-delay:.05s}.r2{animation-delay:.18s}.r3{animation-delay:.3s}.r4{animation-delay:.45s}.r5{animation-delay:.6s}

/* marquee */
.mq{overflow:hidden;padding:26px 0;background:#0b0b0b;border-top:1px solid rgba(201,164,106,.18);border-bottom:1px solid rgba(201,164,106,.18)}
.mq-track{display:flex;align-items:center;gap:40px;width:max-content;animation:marquee 46s linear infinite}
.mq span{font-family:var(--fe);font-style:var(--fes);font-size:calc(42px * var(--fez));line-height:1;color:#f3e9dc;white-space:nowrap}
.mq span.o{font-style:normal;font-size:34px;letter-spacing:.14em;text-transform:uppercase;color:transparent;-webkit-text-stroke:1px #c9a46a}
.star{width:18px;height:18px;fill:#c9a46a;flex:none}

/* chapters */
.ch{position:relative;padding:130px 0 120px;border-bottom:1px solid rgba(201,164,106,.1)}
.ch-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:20px 60px;margin-bottom:28px}
.ch-title{margin:0;font-family:var(--fd);font-weight:500;font-size:calc(clamp(60px,7.4vw,118px) * var(--fdz));line-height:.88;color:#f3e9dc}
.ch-sub{max-width:380px;margin:0 0 12px;font-family:var(--fq);font-style:italic;font-size:calc(25px * var(--fqz));line-height:1.35;color:#b9a99a}
.ct-hint{display:none}
.ct-grid{list-style:none;margin:44px 0 0;padding:0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:20px}
.ct{position:relative;min-width:0;display:flex;flex-direction:column;padding:18px 18px 18px;border-radius:24px;border:1px solid rgba(201,164,106,.2);background:#0a0706;overflow:hidden;scroll-margin-top:110px;transition:border-color .35s,box-shadow .45s,transform .45s cubic-bezier(.2,.8,.2,1)}
.ct:hover{border-color:rgba(201,164,106,.55);transform:translateY(-6px)}
.ct.is-in{border-color:rgba(201,164,106,.8);box-shadow:inset 0 0 0 1px rgba(201,164,106,.35),0 30px 60px -34px rgba(201,164,106,.45)}
.ct-glow{position:absolute;left:18%;top:8%;width:64%;height:34%;border-radius:50%;filter:blur(46px);opacity:.75;pointer-events:none}
/* menu cards: just a few sparks, over the splash only */
.dust.ct-dust{inset:0 0 auto 0;height:56%}
.ct-dust i:nth-child(1){left:22%;animation-delay:var(--dd,0s)}
.ct-dust i:nth-child(2){left:74%;animation-delay:calc(-3s + var(--dd,0s))}
.ct-dust i:nth-child(3){left:48%;animation-delay:calc(-6s + var(--dd,0s))}
.ct-dust i:nth-child(4){left:86%;animation-delay:calc(-1s + var(--dd,0s))}
.ct:nth-child(5n+2){--dd:-4.2s}
.ct:nth-child(5n+3){--dd:-1.7s}
.ct:nth-child(5n+4){--dd:-6.1s}
.ct:nth-child(5n+5){--dd:-3.3s}
.ct:nth-child(even) .ct-dust{transform:scaleX(-1)}
.ct-top{position:relative;display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:26px;font-size:11px;font-weight:400;letter-spacing:.24em;color:#c9a46a}
.ct-in{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 11px 0 8px;border-radius:999px;background:#c9a46a;color:#000000;font-size:10px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;animation:pop .5s cubic-bezier(.3,1.6,.5,1)}
.ct-in .ic{width:13px;height:13px;stroke-width:2.2}
.ct-img{position:relative;display:grid;place-items:center;aspect-ratio:1/.92;margin:2px 0 8px}
.ct-img img{width:90%;height:100%;object-fit:contain;filter:drop-shadow(0 16px 20px rgba(0,0,0,.55));transition:transform .6s cubic-bezier(.2,.8,.2,1)}
.ct:hover .ct-img img{transform:scale(1.06) rotate(-2deg)}
.ct-name{position:relative;margin:0;min-height:2.16em;display:flex;align-items:center;justify-content:center;font-family:var(--fd);font-weight:400;font-size:calc(26px * var(--fdz));line-height:1.08;color:#f3e9dc;text-align:center;text-wrap:balance}
.ct-tag{position:relative;margin:8px 0 0;font-family:var(--fq);font-style:italic;font-size:calc(18px * var(--fqz));line-height:1.3;color:#b9a99a;text-align:center}
.ct-tag b{font-weight:inherit;color:#d4b47a}
.ct-desc{position:relative;flex:1;margin:12px 0 0;font-size:14px;line-height:1.6;color:#9a8b7d;text-align:center}
.ct-buy{position:relative;display:flex;flex-direction:column;gap:14px;margin-top:18px;padding-top:16px;border-top:1px solid rgba(201,164,106,.16)}
.ct-price{margin:0;display:flex;align-items:baseline;justify-content:center;flex-wrap:wrap;gap:0 7px;font-family:var(--fd);font-size:calc(32px * var(--fdz));line-height:1.1;color:#d4b47a}
.ct-price span{font-family:var(--fb);font-size:11px;font-weight:400;letter-spacing:.18em;color:#b9a99a}
.ct-price small{font-family:var(--fb);font-size:11px;font-weight:400;letter-spacing:.16em;text-transform:uppercase;color:#9a8b7d}
.ct-add{width:100%;min-height:48px;display:flex;align-items:center;justify-content:center;gap:10px;border-radius:999px;background:#c9a46a;color:#000000;font-size:11px;font-weight:500;letter-spacing:.2em;text-transform:uppercase;transition:background .3s,transform .3s cubic-bezier(.2,.8,.2,1)}
.ct-add:hover{background:#e0c48e}
.ct-add:active{transform:scale(.96)}
.ct-add .ic{width:16px;height:16px;stroke-width:2}
.ct-step{display:flex;align-items:center;justify-content:space-between;height:48px;border:1px solid #c9a46a;border-radius:999px;background:rgba(201,164,106,.1)}
.ct-step button{width:46px;height:46px;flex:none;display:grid;place-items:center;border-radius:999px;color:#d4b47a;transition:background .3s}
.ct-step button:hover{background:rgba(201,164,106,.18)}
.ct-step .ic{width:16px;height:16px;stroke-width:2}
.ct-step span{font-size:11px;font-weight:400;letter-spacing:.16em;text-transform:uppercase;color:#b9a99a;white-space:nowrap}
.ct-step b{margin-right:4px;font-size:17px;font-weight:500;letter-spacing:0;color:#f3e9dc}
.stepper{display:inline-flex;align-items:center;height:54px;border:1px solid rgba(201,164,106,.5);border-radius:999px}
.stepper button{width:52px;height:52px;display:grid;place-items:center;border-radius:999px;color:#d4b47a;transition:background .3s}
.stepper button:hover{background:rgba(201,164,106,.12)}
.stepper .ic{width:18px;height:18px}
.stepper span{min-width:30px;text-align:center;font-size:17px;font-weight:500}
.stepper.sm{height:46px}
.stepper.sm button{width:44px;height:44px}

/* how */
.how{padding:130px 0}
.steps{list-style:none;margin:70px 0 0;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
.steps li{position:relative;padding:10px 36px 10px;border-left:1px solid rgba(201,164,106,.18)}
.steps li:first-child{border-left:0}
.st-row{display:flex;align-items:center;gap:12px;margin-top:16px}
.st-n{display:block;font-family:var(--fe);font-style:var(--fes);font-size:76px;line-height:1;color:transparent;-webkit-text-stroke:1px rgba(201,164,106,.6)}
.steps .ic{flex:none;width:24px;height:24px;color:#d4b47a}
.steps h3{margin:0;min-width:0;font-family:var(--fd);font-weight:500;font-size:29px;line-height:1.15;color:#f3e9dc}
.steps p{margin:20px 0 0;max-width:320px;font-size:15px;line-height:1.75;color:#b9a99a}

/* box */
.box{position:relative;padding:130px 0 140px;background:#0b0b0b;border-top:1px solid rgba(201,164,106,.14)}
.box-head{margin-bottom:56px}
.box-grid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:56px;align-items:start}
.lines{list-style:none;margin:0;padding:0;border-top:1px solid rgba(201,164,106,.18)}
.line{display:grid;grid-template-columns:76px minmax(0,1fr) auto 120px 44px;grid-template-areas:"img txt step total rm";align-items:center;gap:20px;padding:20px 0;border-bottom:1px solid rgba(201,164,106,.12);animation:enter .7s cubic-bezier(.2,.8,.2,1) both}
.ln-img{grid-area:img;width:76px;height:76px;border-radius:50%;display:grid;place-items:center;transition:background-color .6s}
.ln-img img{width:118%;max-width:none;height:auto;filter:drop-shadow(0 8px 10px rgba(0,0,0,.5))}
.ln-txt{grid-area:txt;min-width:0}
.ln-name{margin:0;font-family:var(--fd);font-size:26px;font-weight:500;line-height:1.15;color:#f3e9dc}
.ln-meta{margin:6px 0 0;font-size:11px;font-weight:400;letter-spacing:.2em;text-transform:uppercase;color:#9a8b7d}
.line .stepper{grid-area:step}
.ln-total{grid-area:total;margin:0;text-align:right;font-family:var(--fd);font-size:24px;font-weight:500;color:#d4b47a;white-space:nowrap}
.rm{grid-area:rm;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:#9a8b7d;transition:color .3s,background .3s}
.rm:hover{color:#f3e9dc;background:rgba(176,40,58,.3)}
.rm .ic{width:18px;height:18px}
.empty{display:flex;flex-direction:column;align-items:flex-start;padding:56px 48px;border:1px dashed rgba(201,164,106,.3);border-radius:28px}
.empty .ic{width:44px;height:44px;color:#c9a46a}
.empty-t{margin:24px 0 0;font-family:var(--fd);font-size:40px;font-weight:500;line-height:1.1;color:#f3e9dc}
.empty-s{max-width:380px;margin:12px 0 32px;font-size:16px;line-height:1.7;color:#b9a99a}
.order{position:sticky;top:100px;display:flex;flex-direction:column;gap:20px;padding:36px;border:1px solid rgba(201,164,106,.24);border-radius:28px;background:#000000;box-shadow:0 40px 80px -30px rgba(0,0,0,.8)}
.order-t{margin:0 0 4px;font-family:var(--fd);font-size:30px;font-weight:500;color:#f3e9dc}
.field{display:flex;flex-direction:column;gap:9px}
.field label,.lbl{font-size:11px;font-weight:400;letter-spacing:.24em;text-transform:uppercase;color:#b9a99a}
.field input,.field textarea{width:100%;min-height:52px;padding:14px 18px;border-radius:14px;border:1px solid rgba(201,164,106,.26);background:#0b0b0b;color:#f3e9dc;font-family:var(--fb);font-weight:300;font-size:15px;color-scheme:dark;transition:border-color .3s,background .3s}
.field textarea{min-height:96px;line-height:1.55;resize:vertical}
.field input::placeholder,.field textarea::placeholder{color:#9a8b7d}
.field input:focus,.field textarea:focus{outline:none;border-color:#d4b47a;background:#1c1512}
.seg{display:grid;grid-template-columns:1fr 1fr;padding:4px;border:1px solid rgba(201,164,106,.26);border-radius:999px;background:#0b0b0b}
.seg button{min-height:46px;border-radius:999px;font-size:12px;font-weight:400;letter-spacing:.2em;text-transform:uppercase;color:#b9a99a;transition:background .35s,color .35s}
.seg button.on{background:#c9a46a;color:#000000;font-weight:500}
.sum{padding-top:18px;border-top:1px solid rgba(201,164,106,.18)}
.sum p{display:flex;justify-content:space-between;align-items:baseline;margin:0 0 8px;font-size:14px;color:#b9a99a}
.sum .sum-total{margin:8px 0 0;font-family:var(--fd);font-size:36px;font-weight:500;color:#f3e9dc}
.sum .sum-total span:first-child{font-family:var(--fb);font-size:12px;font-weight:400;letter-spacing:.24em;text-transform:uppercase;color:#b9a99a}
.sum-note{font-size:13px !important;color:#9a8b7d !important}
.btn-wa{width:100%;justify-content:center}
.btn.off{margin:0;justify-content:center;border:1px dashed rgba(201,164,106,.35);color:#9a8b7d;cursor:not-allowed}
.owner{margin:0;font-size:13px;line-height:1.6;color:#9a8b7d;text-align:center}

/* pill */
.pill{position:fixed;left:50%;bottom:24px;z-index:60;display:flex;align-items:center;gap:14px;max-width:calc(100% - 32px);padding:7px 7px 7px 8px;border-radius:999px;background:rgba(14,14,14,.9);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid rgba(201,164,106,.36);box-shadow:0 24px 60px rgba(0,0,0,.65);opacity:0;visibility:hidden;transform:translate(-50%,140%);transition:transform .7s cubic-bezier(.2,.8,.2,1),opacity .4s,visibility 0s linear .7s}
.pill.show{opacity:1;visibility:visible;transform:translate(-50%,0);transition:transform .7s cubic-bezier(.2,.8,.2,1),opacity .4s,visibility 0s}
.pill.show.pop{animation:pillpop .6s cubic-bezier(.3,1.6,.5,1)}
.pill-n{width:44px;height:44px;flex:none;border-radius:50%;display:grid;place-items:center;background:#c9a46a;color:#000000;font-size:16px;font-weight:500}
.pill-t{display:flex;flex-direction:column;min-width:0;padding-right:6px;font-size:11px;font-weight:400;letter-spacing:.16em;text-transform:uppercase;color:#b9a99a;white-space:nowrap}
.pill-t span{overflow:hidden;text-overflow:ellipsis;max-width:220px}
.pill-t b{font-family:var(--fd);font-size:21px;font-weight:500;letter-spacing:0;text-transform:none;color:#f3e9dc}
.pill-view{min-height:44px;display:flex;align-items:center;padding:0 20px;border-radius:999px;border:1px solid rgba(201,164,106,.42);font-size:11px;font-weight:400;letter-spacing:.2em;text-transform:uppercase;white-space:nowrap}
.pill-wa{width:46px;height:46px;flex:none;border-radius:50%;display:grid;place-items:center;background:#c9a46a;color:#000000}
.pill-wa:hover{background:#e0c48e;color:#000000}
.pill-wa .ic{width:20px;height:20px}

/* footer */
.ft{position:relative;padding:110px 0 0;overflow:hidden}
.ft-word{position:absolute;left:50%;bottom:96px;transform:translateX(-50%);font-family:var(--fs);font-style:var(--fss);font-size:clamp(160px,24vw,360px);line-height:1;color:rgba(201,164,106,.06);white-space:nowrap;pointer-events:none;user-select:none}
.ft-top{position:relative;display:flex;flex-wrap:wrap;justify-content:space-between;gap:56px}
.ft-brand{display:flex;flex-direction:column;align-items:flex-start;gap:18px}
.ft-brand .seal{width:72px;height:72px}
.ft-brand .wm{font-size:30px}
.ft-brand p{margin:0;font-family:var(--fq);font-style:italic;font-size:calc(22px * var(--fqz));color:#b9a99a}
.ft-cols{display:grid;grid-template-columns:repeat(4,minmax(0,auto));gap:28px 64px}
.ft-h{margin:0 0 14px;font-size:11px;font-weight:400;letter-spacing:.28em;text-transform:uppercase;color:#c9a46a}
.ft-cols p:not(.ft-h){margin:0;font-size:15px;line-height:1.7;color:#d8c8b4}
.ft-cols a{display:inline-block;padding:4px 0}
.ft-cols .nw{white-space:nowrap}
.ft-cols .soc{display:flex;gap:12px;margin-top:2px}
.ft-cols .soc a{display:grid;place-items:center;width:46px;height:46px;padding:0;border-radius:50%;border:1px solid rgba(201,164,106,.35);color:#d4b47a;transition:background-color .3s,color .3s,border-color .3s,transform .3s}
.ft-cols .soc a:hover{background:#c9a46a;border-color:#c9a46a;color:#000000;transform:translateY(-3px)}
.soc .ic{width:20px;height:20px}
.ft-bot{position:relative;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 24px;margin-top:190px;padding:26px 0 30px;border-top:1px solid rgba(201,164,106,.14);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#9a8b7d;transition:padding-bottom .5s ease}
.ft-bot p{margin:0}
.ft-bot a{color:#d4b47a;font-weight:500;transition:color .3s}
.ft-bot a:hover{color:#f3e9dc}
.ft.pill-pad .ft-bot{padding-bottom:104px}

/* scroll reveals where supported */
@supports (animation-timeline: view()){
  .ch-head,.ct-grid,.steps li,.box-head{animation:reveal linear both;animation-timeline:view();animation-range:entry 0% cover 28%}
}

@keyframes enter{from{opacity:0;transform:translateY(28px)}}
@keyframes slidein{from{opacity:0;transform:translateX(110px)}}
@keyframes drift{0%{transform:translateY(0) scale(.6);opacity:0}15%{opacity:.95}85%{opacity:.5}100%{transform:translateY(-300px) scale(1);transform:translateY(-84cqh) scale(1);opacity:0}}
@keyframes floaty{50%{transform:translateY(-10px)}}
@keyframes reveal{from{opacity:0;transform:translateY(60px)}to{opacity:1;transform:none}}
@keyframes marquee{to{transform:translateX(calc(-50% - 20px))}}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.35)}100%{transform:scale(1)}}
@keyframes pillpop{0%{transform:translate(-50%,0) scale(1)}40%{transform:translate(-50%,0) scale(1.06)}100%{transform:translate(-50%,0) scale(1)}}
@keyframes flicker{0%,100%{transform:scaleY(1);opacity:1}45%{transform:scaleY(.9) skewX(2deg);opacity:.85}70%{transform:scaleY(1.04) skewX(-2deg)}}

@media (max-width: 1100px){
  .ct-grid{display:flex;flex-wrap:wrap;justify-content:center}
  .ct{flex:0 0 calc((100% - 40px) / 3)}
}
@media (max-width: 980px){
  .hx{gap:14px}
  .hx-tile{height:330px;padding:0 12px 22px}
  .hx-no{left:16px;top:22px;font-size:10px;letter-spacing:.2em}
  .hx-go{right:12px;top:12px;width:32px;height:32px}
  .hx-tile img{width:172px;height:172px}
  .hx-name{font-size:calc(30px * var(--fdz))}
  .nav{display:none}
  .steps{grid-template-columns:1fr;gap:48px}
  .steps li{border-left:0;padding:0}
  .box-grid{grid-template-columns:1fr}
  .order{position:relative;top:0}
}
@media (max-width: 640px){
  .wrap{padding:0 16px}
  .hd-in{height:64px}
  .brand .seal{width:36px;height:36px}
  .wm{font-size:18px;letter-spacing:.32em;margin-right:-.32em}
  .bt{display:none}
  .boxbtn{padding:0 6px 0 14px}
  .hero{padding:44px 0 56px}
  .hero-word{top:110px}
  .h1{font-size:calc(clamp(30px,10.4vw,54px) * var(--fdz))}
  .hx-copy .eyebrow{gap:10px;letter-spacing:.2em}
  .hx-copy .dash{width:24px}
  .hx{margin-top:36px;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  .hx-tile{height:250px;padding:0 8px 16px;border-radius:20px}
  .hx-tile:hover{transform:none}
  .hx-no{left:14px;top:19px;font-size:9px;letter-spacing:.18em}
  .hx-go{right:10px;top:10px;width:28px;height:28px}
  .hx-go .ic{width:13px;height:13px}
  .hx-tile img{width:124px;height:124px;margin-bottom:6px}
  .hx-name{font-size:calc(25px * var(--fdz))}
  .hx-meta{margin-top:6px;font-size:9px;letter-spacing:.16em}
  .hx-cta{margin-top:36px}
  .mq span{font-size:30px}
  .mq span.o{font-size:24px}
  .ch{padding:90px 0 80px}
  .ch-sub{font-size:21px}
  .ch-head{margin-bottom:0}
  .ct-hint{display:flex;align-items:center;justify-content:flex-end;gap:8px;margin:28px 0 0;font-size:10px;font-weight:400;letter-spacing:.24em;text-transform:uppercase;color:#9a8b7d}
  .ct-hint .ic{width:16px;height:16px;color:#c9a46a}
  .ct-grid{flex-wrap:nowrap;justify-content:flex-start;gap:14px;margin:14px -16px 0;padding:8px 16px 20px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-padding:0 16px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .ct-grid::-webkit-scrollbar{display:none}
  .ct{flex:0 0 76%;scroll-snap-align:start;padding:16px;border-radius:22px}
  .ct:hover{transform:none}
  .ct-name{font-size:calc(25px * var(--fdz))}
  .how{padding:90px 0}
  .box{padding:90px 0 110px}
  .line{grid-template-columns:60px minmax(0,1fr) 44px;grid-template-areas:"img txt rm" "step step total";gap:12px 14px}
  .ln-img{width:60px;height:60px}
  .ln-name{font-size:22px}
  .ln-total{align-self:center}
  .empty{padding:40px 24px}
  .order{padding:24px 18px}
  .pill{gap:10px;bottom:16px}
  .pill-t span{max-width:110px}
  .pill-view{padding:0 14px}
  .ft{padding:80px 0 0}
  .ft-word{bottom:150px}
  .ft-bot{flex-direction:column;gap:8px;margin-top:140px;padding-bottom:28px;text-align:center;letter-spacing:.12em;line-height:1.6}
  .ft-bot p{text-wrap:balance}
  .ft.pill-pad .ft-bot{padding-bottom:96px}
  .ft-cols{grid-template-columns:repeat(2,minmax(0,1fr));gap:28px 24px}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none !important;transition:none !important}
  html{scroll-behavior:auto}
}
</style>
</head>
<body>
<div id="app"></div>

<template id="tpl">
<div class="m {{typeCls}}">

<header class="hd">
  <div class="wrap hd-in">
    <a class="brand" href="#top" aria-label="MIHIRI, back to top">
      <svg class="seal" viewBox="0 0 120 120" aria-hidden="true"><circle class="seal-c" cx="60" cy="60" r="56"></circle><circle class="seal-c2" cx="60" cy="60" r="49"></circle><path class="seal-m" d="M 32 86 L 32 52 C 32 40 44 36 50 46 L 60 64 L 70 46 C 76 36 88 40 88 52 L 88 86"></path><path class="seal-f" d="M60 22 C 64 30 67 34 60 38 C 53 34 56 30 60 22Z"></path></svg>
      <span class="wm">MIHIRI</span>
    </a>
    <nav class="nav" aria-label="Menu chapters">
      <a href="#cakes">Cakes</a>
      <a href="#cupcakes">Cupcakes</a>
      <a href="#desserts">Desserts</a>
      <a href="#cookies">Cookies</a>
    </nav>
    <a class="boxbtn" href="#box" aria-label="{{countLabel}}">
      <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 8h14l-1.2 11.2a2 2 0 0 1-2 1.8H8.2a2 2 0 0 1-2-1.8L5 8z"></path><path d="M9 8V6.5a3 3 0 0 1 6 0V8"></path></svg>
      <span class="bt">Your box</span>
      <span class="badge {{badgeCls}}">{{count}}</span>
    </a>
  </div>
</header>

<section class="hero" id="top">
  <div class="hero-word" aria-hidden="true">MIHIRI</div>
  <div class="wrap hx-copy">
    <p class="eyebrow rise r1"><span class="dash"></span>Twenty handcrafted treats<span class="dash"></span></p>
    <h1 class="h1"><span class="rise r2">Four chapters</span><em class="rise r3">of sweet.</em></h1>
  </div>
  <ul class="wrap hx" aria-label="The four chapters of the menu">
    <sc-for list="{{chapters}}" as="t" hint-placeholder-count="4">
    <li><a class="hx-tile" href="#{{t.id}}"><span class="hx-glow" style="background-color: {{t.glow}}"></span><span class="dust" aria-hidden="true" style="color: {{t.spark}}"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span><span class="hx-no">{{t.tag}}</span><span class="hx-go" aria-hidden="true"><svg class="ic" viewBox="0 0 24 24"><path d="M5 12h14"></path><path d="M13 6l6 6-6 6"></path></svg></span><span class="hx-pic"><img src="{{t.img}}" alt=""></span><span class="hx-name">{{t.name}}</span><span class="hx-meta">{{t.count}} treats</span></a></li>
    </sc-for>
  </ul>
  <div class="wrap hx-cta rise r5">
    <a class="btn btn-gold" href="#cakes">Explore the menu<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"></path><path d="M13 6l6 6-6 6"></path></svg></a>
    <a class="btn btn-line" href="{{heroWa}}" target="_blank" rel="noopener"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 20.5l1.4-4.2A8.6 8.6 0 1 1 8 19.3z"></path><path d="M9.2 8.6c.2 2.9 3.3 6 6.2 6.2l1.1-1.5-1.9-.9-.8.7a4.4 4.4 0 0 1-2.9-2.9l.7-.8-.9-1.9z"></path></svg>Order on WhatsApp</a>
  </div>
</section>

<div class="mq" aria-hidden="true">
  <div class="mq-track">
    <span>Cakes</span><svg class="star" viewBox="0 0 24 24"><path d="M12 1.5 L13.9 10.1 L22.5 12 L13.9 13.9 L12 22.5 L10.1 13.9 L1.5 12 L10.1 10.1 Z"></path></svg>
    <span class="o">Cupcakes</span><svg class="star" viewBox="0 0 24 24"><path d="M12 1.5 L13.9 10.1 L22.5 12 L13.9 13.9 L12 22.5 L10.1 13.9 L1.5 12 L10.1 10.1 Z"></path></svg>
    <span>Desserts</span><svg class="star" viewBox="0 0 24 24"><path d="M12 1.5 L13.9 10.1 L22.5 12 L13.9 13.9 L12 22.5 L10.1 13.9 L1.5 12 L10.1 10.1 Z"></path></svg>
    <span class="o">Cookies</span><svg class="star" viewBox="0 0 24 24"><path d="M12 1.5 L13.9 10.1 L22.5 12 L13.9 13.9 L12 22.5 L10.1 13.9 L1.5 12 L10.1 10.1 Z"></path></svg>
    <span>Handcrafted nightly</span><svg class="star" viewBox="0 0 24 24"><path d="M12 1.5 L13.9 10.1 L22.5 12 L13.9 13.9 L12 22.5 L10.1 13.9 L1.5 12 L10.1 10.1 Z"></path></svg>
    <span>Cakes</span><svg class="star" viewBox="0 0 24 24"><path d="M12 1.5 L13.9 10.1 L22.5 12 L13.9 13.9 L12 22.5 L10.1 13.9 L1.5 12 L10.1 10.1 Z"></path></svg>
    <span class="o">Cupcakes</span><svg class="star" viewBox="0 0 24 24"><path d="M12 1.5 L13.9 10.1 L22.5 12 L13.9 13.9 L12 22.5 L10.1 13.9 L1.5 12 L10.1 10.1 Z"></path></svg>
    <span>Desserts</span><svg class="star" viewBox="0 0 24 24"><path d="M12 1.5 L13.9 10.1 L22.5 12 L13.9 13.9 L12 22.5 L10.1 13.9 L1.5 12 L10.1 10.1 Z"></path></svg>
    <span class="o">Cookies</span><svg class="star" viewBox="0 0 24 24"><path d="M12 1.5 L13.9 10.1 L22.5 12 L13.9 13.9 L12 22.5 L10.1 13.9 L1.5 12 L10.1 10.1 Z"></path></svg>
    <span>Handcrafted nightly</span><svg class="star" viewBox="0 0 24 24"><path d="M12 1.5 L13.9 10.1 L22.5 12 L13.9 13.9 L12 22.5 L10.1 13.9 L1.5 12 L10.1 10.1 Z"></path></svg>
  </div>
</div>

<sc-for list="{{categories}}" as="cat" hint-placeholder-count="4">
<section class="ch" id="{{cat.id}}" aria-labelledby="h-{{cat.id}}">
  <div class="wrap">
    <header class="ch-head">
      <div>
        <p class="eyebrow"><span class="dash"></span>Chapter {{cat.numeral}}</p>
        <h2 class="ch-title" id="h-{{cat.id}}">{{cat.name}}</h2>
      </div>
      <p class="ch-sub">{{cat.sub}}</p>
    </header>
    <p class="ct-hint" aria-hidden="true">Swipe for all five<svg class="ic" viewBox="0 0 24 24"><path d="M5 12h14"></path><path d="M13 6l6 6-6 6"></path></svg></p>
    <ol class="ct-grid" aria-label="{{cat.name}} menu">
      <sc-for list="{{cat.items}}" as="p" hint-placeholder-count="5">
      <li class="ct {{p.cls}}" id="it-{{p.id}}">
        <span class="ct-glow" style="background-color: {{p.glow}}" aria-hidden="true"></span>
        <span class="dust ct-dust" aria-hidden="true" style="color: {{p.spark}}"><i></i><i></i><i></i><i></i></span>
        <div class="ct-top">
          <span>{{p.tagNo}}</span>
          <sc-if value="{{p.inBox}}" hint-placeholder-val="{{ false }}"><span class="ct-in"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>Added</span></sc-if>
        </div>
        <div class="ct-img"><img src="{{p.img}}" alt="{{p.name}}"></div>
        <h3 class="ct-name">{{p.name}}</h3>
        <p class="ct-tag">{{p.lead}} <b>{{p.accent}}</b></p>
        <p class="ct-desc">{{p.desc}}</p>
        <div class="ct-buy">
          <p class="ct-price"><span>Rs.</span>{{p.price}}<small>/ {{p.unit}}</small></p>
          <sc-if value="{{p.notInBox}}" hint-placeholder-val="{{ true }}">
            <button class="ct-add" type="button" onClick="{{p.add}}" aria-label="{{p.addLabel}}"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14"></path><path d="M5 12h14"></path></svg>Add to box</button>
          </sc-if>
          <sc-if value="{{p.inBox}}" hint-placeholder-val="{{ false }}">
            <div class="ct-step" role="group" aria-label="{{p.qtyLabel}}">
              <button type="button" onClick="{{p.dec}}" aria-label="{{p.decLabel}}"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"></path></svg></button>
              <span aria-live="polite"><b>{{p.qty}}</b>in box</span>
              <button type="button" onClick="{{p.inc}}" aria-label="{{p.incLabel}}"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14"></path><path d="M5 12h14"></path></svg></button>
            </div>
          </sc-if>
        </div>
      </li>
      </sc-for>
    </ol>
  </div>
</section>
</sc-for>

<section class="how" aria-labelledby="h-how">
  <div class="wrap">
    <p class="eyebrow center"><span class="dash"></span>Ordering, simplified<span class="dash"></span></p>
    <h2 class="sec-title" id="h-how">Three steps to <em>something sweet</em></h2>

const ONE = /^\{\{\s*([\w.$]+)\s*\}\}$/, ANY = /\{\{\s*([\w.$]+)\s*\}\}/g;

          id: it.id,
          cls: q > 0 ? 'is-in' : '',
          tagNo: c.numeral + ' · 0' + (i + 1),
          img: it.img,
          glow: it.glow,
          spark: spark(it.glow),
          name: it.name,
          lead: it.lead,
          accent: it.accent,
          desc: it.desc,
          price: fmt(it.price),
          unit: it.unit,
          qty: q,
          inBox: q > 0,
          notInBox: q === 0,
          add: () => this.change(it, 1),
          inc: () => this.change(it, 1),
          dec: () => this.change(it, -1),
          addLabel: 'Add ' + it.name + ' to your box',
          qtyLabel: 'Quantity of ' + it.name,
          incLabel: 'One more ' + it.name,
          decLabel: 'One less ' + it.name
        };
      })
    }));

    const chosen = all.filter(it => (s.cart[it.id] || 0) > 0);
    const lines = chosen.map(it => {
      const q = s.cart[it.id];
      return {
        img: it.img,
        glow: it.glow,
        name: it.name,
        meta: it.cat + ' · ' + it.unit,
        qty: q,
        total: fmt(q * it.price),
        inc: () => this.change(it, 1),
        dec: () => this.change(it, -1),
        remove: () => this.remove(it),
        qtyLabel: 'Quantity of ' + it.name,
        incLabel: 'One more ' + it.name,
        decLabel: 'One less ' + it.name,
        rmLabel: 'Remove ' + it.name + ' from your box'
      };
    });
    const count = chosen.reduce((t, it) => t + s.cart[it.id], 0);
    const total = chosen.reduce((t, it) => t + s.cart[it.id] * it.price, 0);

    const when = s.when ? new Date(s.when) : null;
    const whenTxt = when && !isNaN(when.getTime())
      ? when.toLocaleString('en-GB', { weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' })
      : '';
    const msg = [
      "Hello MIHIRI! I'd like to order:",
      '',
      ...chosen.map(it => `• ${s.cart[it.id]} × ${it.name} (${it.unit}) — Rs. ${fmt(s.cart[it.id] * it.price)}`),
      '',
      `Total: Rs. ${fmt(total)}`,
      s.name ? `Name: ${s.name}` : null,
      s.mode === 'Delivery' ? `Delivery to: ${s.address || '(address to confirm)'}` : 'Pickup from the shop',
      whenTxt ? `Date & time: ${whenTxt}` : null,
      s.note ? `Note: ${s.note}` : null
    ].filter(v => v !== null).join('\n');
    const base = num ? `https://wa.me/${num}` : 'https://wa.me/';
    const waHref = `${base}?text=${encodeURIComponent(msg)}`;
    const heroWa = `${base}?text=${encodeURIComponent("Hello MIHIRI! I'd like to place an order.")}`;

    const tf = ["Classic — Cormorant","Couture — Bodoni","Deco — Italiana","Grand — Cinzel","Boutique — Fraunces","Editorial — Instrument","Salon — Playfair","Bold — DM Serif"].indexOf(this.props.typeface ?? '');
    return {
      typeCls: 't' + (tf < 0 ? 3 : tf + 1),
      chapters,
      categories,
      lines,
      count,
      totalFmt: fmt(total),
      countLabel: `Your box, ${count} ${count === 1 ? 'item' : 'items'}`,
      hasItems: count > 0,
      empty: count === 0,
      badgeCls: s.bump ? 'pop' : '',
      pillCls: (count > 0 ? 'show' : '') + (s.bump ? ' pop' : ''),
      pillText: s.bump ? 'Added · ' + s.last : (count === 1 ? 'Item in your box' : 'Items in your box'),
      name: s.name,
      address: s.address,
      when: s.when,
      note: s.note,
      setName: e => this.setState({ name: e.target.value }),
      setAddress: e => this.setState({ address: e.target.value }),
      setWhen: e => this.setState({ when: e.target.value }),
      setNote: e => this.setState({ note: e.target.value }),
      isDelivery: s.mode === 'Delivery',
      pickCls: s.mode === 'Pickup' ? 'on' : '',
      delCls: s.mode === 'Delivery' ? 'on' : '',
      pickPressed: s.mode === 'Pickup' ? 'true' : 'false',
      delPressed: s.mode === 'Delivery' ? 'true' : 'false',
      setPickup: () => this.setState({ mode: 'Pickup' }),
      setDelivery: () => this.setState({ mode: 'Delivery' }),
      waHref,
      heroWa,
      telHref: num ? 'tel:+' + num : '#',
      noNumber: !num,
      numberDisplay: num.length === 11 && num.startsWith('94') ? `+94 ${num.slice(2, 4)} ${num.slice(4, 7)} ${num.slice(7)}` : num ? '+' + num : '[YOUR WHATSAPP NUMBER]',
      igHref: String(this.props.instagram ?? '').trim() || '#',
      fbHref: String(this.props.facebook ?? '').trim() || '#',
      ftCls: count > 0 ? 'pill-pad' : '',
      agencyName: String(this.props.agency ?? '').trim() || '361 Digital Labs',
      agencyHref: String(this.props.agencyFacebook ?? '').trim() || '#'
    };
  }
}

const app = new Component();
app.props = {"typeface":"Deco — Italiana","whatsapp":"0729879869","instagram":"","facebook":"","agency":"361 Digital Labs","agencyFacebook":""};
const root = document.getElementById('app');
const tplRoot = document.getElementById('tpl').content;
let queued = false;
function render() { const out = []; build(tplRoot, app.renderVals(), out); patch(root, out); }
function schedule() { if (!queued) { queued = true; queueMicrotask(() => { queued = false; render(); }); } }
render();
if (location.hash) { const t = document.getElementById(location.hash.slice(1)); if (t) t.scrollIntoView(); }
</script>
</body>
</html>
